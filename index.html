<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkDrop | Downloading...</title>
    <style>
        body { background: #FFD600; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #000; color: #fff; padding: 40px; border-radius: 30px; text-align: center; width: 85%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .loader { border: 5px solid #333; border-top: 5px solid #FFD600; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="loader" id="spinner"></div>
        <h2 id="status">File Found!</h2>
        <p id="message">Your download is starting automatically...</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const fileUrl = params.get('d');

        if (fileUrl) {
            window.location.replace(fileUrl); 
            setTimeout(() => {
                document.getElementById('status').innerText = "Success!";
                document.getElementById('spinner').style.display = 'none';
            }, 3000);
        } else {
            document.getElementById('status').innerText = "Error";
            document.getElementById('message').innerText = "No link found.";
            document.getElementById('spinner').style.display = 'none';
        }
    </script>
</body>
</html>
